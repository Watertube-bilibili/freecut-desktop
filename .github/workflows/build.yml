name: Build desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            targets: dir portable
            engine: win32-x64
            executable: ffmpeg.exe
            application: release/win-unpacked/FreeCut.exe
          - os: macos-15
            platform: mac
            arch: arm64
            targets: dmg zip
            engine: darwin-arm64
            executable: ffmpeg
            application: release/mac-arm64/FreeCut.app/Contents/MacOS/FreeCut
          - os: macos-15-intel
            platform: mac
            arch: x64
            targets: dmg zip
            engine: darwin-x64
            executable: ffmpeg
            application: release/mac/FreeCut.app/Contents/MacOS/FreeCut
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      FREECUT_FFMPEG_SOURCE_DIR: ${{ github.workspace }}/resources/ffmpeg-source/engine
      FFMPEG_BIN: ${{ github.workspace }}/resources/ffmpeg-source/engine/${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Restore verified FFmpeg source build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            resources/ffmpeg-source/archives
            resources/ffmpeg-source/engine
            artifacts/FreeCut-ffmpeg-source-${{ matrix.engine }}.tar.gz
          key: freecut-ffmpeg-v1-${{ matrix.engine }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/download-ffmpeg-sources.mjs') }}
      - name: Install native Windows build tools
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: make diffutils tar xz mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
      - name: Install native macOS build tools
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install nasm pkg-config
      - name: Build Windows FFmpeg from pinned source
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh ${{ matrix.engine }}
      - name: Build macOS FFmpeg from pinned source
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh ${{ matrix.engine }}
      - name: Cache completed FFmpeg engine and corresponding source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            resources/ffmpeg-source/archives
            resources/ffmpeg-source/engine
            artifacts/FreeCut-ffmpeg-source-${{ matrix.engine }}.tar.gz
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - run: npm ci
      - run: node scripts/prepare-ffmpeg.mjs
      - run: npm test
      - run: npm run build
      - name: Verify AI Skill through the real editor and MP4 export
        run: node skills/shuiguan-cut/scripts/shuiguan-cut.cjs demo --repo . --out-dir artifacts/skill-smoke
      - name: Verify editor regressions in isolated desktop profile
        run: node scripts/regression-editor.cjs
      - name: Verify preview seeking and layout changes with real video
        run: node scripts/regression-preview.cjs
      - name: Verify home, recent projects and unsaved exit protection
        run: node scripts/regression-home.cjs
      - name: Verify one-click keyframes and professional mode interoperability
        run: node scripts/regression-keyframes.cjs
      - name: Verify direct preview manipulation and one-gesture undo
        run: node scripts/regression-transform.cjs
      - name: Verify real stereo preview and exported channels
        run: node scripts/regression-audio.cjs
      - name: Verify sound library playback and repeated insertion
        run: node scripts/regression-sounds.cjs
      - name: Verify masks, filters and controls in short windows
        run: node scripts/regression-effects.cjs
      - name: Verify update download and unsaved project protection
        run: node scripts/regression-update.cjs
      - name: Verify custom installer paths, cancellation and uninstall
        if: runner.os == 'Windows'
        run: node installer/smoke.cjs
      - name: Archive matching application source
        shell: bash
        run: git archive --format=tar.gz --prefix=FreeCut-source/ --output=artifacts/FreeCut-project-source-${{ github.sha }}.tar.gz HEAD
      - name: Package unsigned test distribution
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.targets }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged desktop with real media
        timeout-minutes: 10
        run: node -e "process.env.FREECUT_TEST_EXE=require('path').resolve('${{ matrix.application }}');require('./scripts/smoke-desktop.cjs');"
      - name: Verify actual macOS update ZIP
        if: runner.os == 'macOS'
        run: node scripts/verify-mac-update.cjs --arch ${{ matrix.arch }}
      - name: Build the custom Windows installer
        if: runner.os == 'Windows'
        run: node scripts/package-installer.cjs
      - name: Verify embedded Windows plugins match archived upstream sources
        if: runner.os == 'Windows'
        run: node -e "const p=require('./package.json');process.argv=[process.execPath,'verify.cjs','release/FreeCut-'+p.version+'-win-x64-Setup.exe','release/FreeCut-'+p.version+'-win-x64-Portable.exe'];require('./docs/third-party/windows-launcher/verify.cjs');"
      - name: Verify actual Setup, installed editor and uninstaller
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: node installer/smoke-setup.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: FreeCut-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            artifacts/*source*.tar.gz
            artifacts/smoke/*
            artifacts/skill-smoke/report.json
            artifacts/skill-smoke/preview.png
            artifacts/skill-smoke/render.mp4
            resources/ffmpeg/*.txt
            resources/ffmpeg/*.json
          if-no-files-found: error
          retention-days: 14
