name: Verify Internet collaboration transport
on:
  workflow_dispatch:
    inputs:
      peer:
        description: Temporary synthetic-test public key or room invitation
        required: true
        type: string
      challenge:
        description: Temporary synthetic-test challenge
        required: true
        type: string
permissions:
  contents: read
jobs:
  internet-link:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - name: Transfer generated bytes over the real encrypted Internet connection
        env:
          FREECUT_NETWORK_QA_PEER: ${{ inputs.peer }}
          FREECUT_NETWORK_QA_CHALLENGE: ${{ inputs.challenge }}
        shell: bash
        run: |
          if [[ "$FREECUT_NETWORK_QA_PEER" == freecut2:* ]]; then
            node scripts/verify-internet-collaboration.cjs join
          else
            node scripts/verify-internet-link.cjs join
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internet-link-report
          path: .cache/internet-link/join*report.json
          include-hidden-files: true
          retention-days: 3
