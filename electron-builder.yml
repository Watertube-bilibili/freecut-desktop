appId: org.freecut.desktop
productName: FreeCut
copyright: Copyright © 2026 FreeCut contributors
asar: true
electronLanguages: [en-US, zh-CN]
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*.cjs
  - electron/**/*.mjs
  - shared/**/*.mjs
  - electron/*.ps1
  - electron/*.sh
  - '!electron/**/*.test.cjs'
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - docs/third-party/p2p/**/*
  - docs/third-party/concat/**/*
  - docs/WOLFCUT-INTEGRATION.md
extraResources:
  - from: docs/third-party/concat
    to: licenses/concat
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: licenses/GPL-3.0.txt
  - from: docs/WOLFCUT-INTEGRATION.md
    to: licenses/WOLFCUT-INTEGRATION.md
  - from: resources/ffmpeg
    to: ffmpeg
  - from: installer
    to: freecut-installer
    filter:
      - main.cjs
      - preload.cjs
      - backend.cjs
      - legacy.cjs
      - shortcuts.cjs
      - refresh-icons.ps1
      - icon.json
      - icons/*.ico
      - i18n.js
      - index.html
      - styles.css
      - renderer.js
      - uninstall.ps1
      - icon.png
artifactName: FreeCut-${version}-${os}-${arch}.${ext}
win:
  icon: resources/icon.ico
  target:
    - target: portable
      arch: [x64]
  signExecutable: false
portable:
  artifactName: FreeCut-${version}-win-${arch}-Portable.${ext}
  requestExecutionLevel: user
mac:
  icon: resources/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.video
  identity: '-'
  hardenedRuntime: false
  notarize: false
publish: null
