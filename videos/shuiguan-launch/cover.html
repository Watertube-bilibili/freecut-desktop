<style>

*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden}
body{font-family:Noto,sans-serif;background:#091C19;color:#F4F3E8}

.version{border:2px solid #53756B;padding:8px 20px;letter-spacing:2px;color:#B1CFC3}
h1{position:absolute;top:163px;left:78px;margin:0;font-size:180px;line-height:1.2;font-weight:700;letter-spacing:-9px;color:#78E4BC}
.story{position:absolute;top:415px;left:92px;font-size:55px;line-height:1.6;letter-spacing:1px;margin:0}
.story strong{font-weight:700;color:#FF8D73}.story .tools{font-size:58px;letter-spacing:-1px;font-weight:700}

.screen img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain}
.screen-label{position:absolute;right:26px;bottom:-55px;padding:8px 15px;background:#F4F3E8;color:#091C19;border:3px solid #091C19;font-size:25px;letter-spacing:2px}
.icon{position:absolute;right:125px;top:125px;width:245px;height:245px;transform:rotate(8deg)}

.feature-band{position:absolute;left:0;right:0;bottom:0;height:161px;background:#78E4BC;color:#091C19;display:flex;align-items:center;justify-content:center;gap:37px;font-size:65px;font-weight:700;letter-spacing:2px;border-top:5px solid #091C19}
.divider{width:13px;height:13px;background:#091C19;transform:rotate(45deg)}
