      const tl = gsap.timeline({ paused: true });

          { y: 0, duration: duration, ease: "power4.out", immediateRender: false },

      const F = 1 / 60;

      arrive(".f05-support", 1.1, 45, 0.15);
      arrive(".f05-evidence", 1.4, 16, 0.2);

      // Content-aware sequencing is calculated once, inside the locked scene.
      // The longer final entry receives more reading time; 9–10s is a still hold.
      const CONTENT = [
        { selector: ".f05-row-ai", body: "自动字幕 / 语音朗读", hold: 0.65 },
        { selector: ".f05-row-local", body: "按需下载 · 本地运行", hold: 0.9 },

      ];
      const START = 1.6;
      const READ_END = 9;
      const BASE_DURATION = 0.75;
      const SEC_PER_CHAR = 0.04;
      const weights = CONTENT.map(function (entry) {
        return BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
      });
      const timeScale = (READ_END - START) / weights.reduce(function (sum, value) { return sum + value; }, 0);
      let cumulative = START;
      const TIMELINE = CONTENT.map(function (entry, index) {
        const start = cumulative;
        cumulative += weights[index] * timeScale;
        return { selector: entry.selector, start: start, end: cumulative };
      });

      // forward and backward seeks work even when callbacks are suppressed.
      TIMELINE.forEach(function (entry, index) {

        if (index > 0) {
          tl.set(TIMELINE[index - 1].selector, { attr: { "data-f05-active": "false" } }, entry.start);
        }
      });

      // A nonvisual clock fixes the timeline length without an exit or drift.
      const clock = { time: 0 };
      tl.to(clock, { time: DURATION, duration: DURATION, ease: "none" }, 0);
