  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-open"] = tl;

      // Content-aware sequencing is reduced once at build time. The holds
      // preserve the packet's locked 0 / 1.1 / 3.3 / 7 second phase boundaries.
      const CONTENT = [
        { key: "principle", body: "开源，也开放", hold: 0.26 },
        { key: "invitation", body: "一起把它做得更好", hold: 1.28 },
        { key: "proof", body: "预览版，持续改进中", hold: 2.74 }
      ];
      let cumulative = 0;
      const TIMELINE = CONTENT.map((entry) => {
        const duration = 0.6 + Array.from(entry.body).length * 0.04 + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });

      // Each block appends to the statement. Baked GSAP states avoid DOM
      // replacement callbacks and remain deterministic during reverse seeks.
      gsap.set(".f06-enter", { opacity: 0 });
      const F = 1 / 60;
      const arrive = (selector, start, distance, duration) => {
        tl.set(selector, { opacity: 1 }, start);
        tl.fromTo(selector,
          { y: distance },
          { y: 0, duration, ease: "power4.out", immediateRender: false },
          start
        );
      };
      const waterfall = (items, start) => {
        let cursor = start;
        items.forEach((item) => {
          arrive(item.selector, cursor, item.distance, item.duration);
          cursor += item.duration - item.overlap * F;
        });
      };

      const openingStart = TIMELINE[0].start + 0.06;
      waterfall([
        { selector: ".f06-title-anchor", distance: 80, duration: 0.18, overlap: 1 },
        { selector: ".f06-title-punctuation", distance: 40, duration: 0.10, overlap: 2 },
        { selector: ".f06-title-link", distance: 45, duration: 0.15, overlap: 1 },
        { selector: ".f06-title-fragment-a", distance: 70, duration: 0.16, overlap: 2 },
        { selector: ".f06-title-fragment-b", distance: 70, duration: 0.15, overlap: 2 }
      ], openingStart);
      tl.set(".f06-opening-mark", { opacity: 1 }, openingStart + 0.18 - F + 0.10 - 2 * F + 0.15 - F);

      waterfall([
        { selector: ".f06-support-a", distance: 70, duration: 0.18, overlap: 1 },
        { selector: ".f06-support-b", distance: 48, duration: 0.15, overlap: 1 },
        { selector: ".f06-support-c", distance: 45, duration: 0.14, overlap: 1 },
        { selector: ".f06-support-d", distance: 70, duration: 0.16, overlap: 2 },
        { selector: ".f06-support-e", distance: 70, duration: 0.15, overlap: 2 }
      ], TIMELINE[1].start);
      arrive(".f06-product-icon", TIMELINE[1].start + 1.05, 80, 0.20);

      arrive(".f06-proof-label", TIMELINE[2].start, 70, 0.18);

      // The invitation resolves progressively into the complete three-part
      // label. Equal-length verbs receive equal reading time; feedback holds.
      const ACTIONS = [
        { body: "开源", selector: ".f06-action-open", hold: 0, distance: 70, entrance: 0.18 },
        { body: "试用", selector: ".f06-action-try", hold: 0, distance: 48, entrance: 0.15 },
        { body: "反馈", selector: ".f06-action-feedback", hold: 0.85, distance: 70, entrance: 0.15 }
      ];
      let actionCursor = TIMELINE[2].start + 0.75;
      const ACTION_TIMELINE = ACTIONS.map((entry) => {
        const start = actionCursor;
        actionCursor += 0.6 + Array.from(entry.body).length * 0.05 + entry.hold;
        return { ...entry, start, end: actionCursor };
      });
      ACTION_TIMELINE.forEach((entry) => {
        arrive(entry.selector, entry.start, entry.distance, entry.entrance);
      });

      // All content is settled by 5.60s. The last second is a readable hold;
      // the parent owns the following hard cut and the caption/watermark tracks.
      const clock = { time: 0 };
      tl.to(clock, { time: 7, duration: 7, ease: "none" }, 0);
    })();
  </script>
