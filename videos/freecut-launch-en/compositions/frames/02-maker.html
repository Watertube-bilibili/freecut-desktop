      // Waterfall: binary visibility, one upward axis, shorter overlapping
      // arrivals. Each word rises through its own fixed overflow mask.
      function arrive(target, time, distance, duration) {
        tl.set(target, { opacity: 1 }, time);
        tl.fromTo(target,
          { y: distance },
          { y: 0, duration: duration, ease: "power4.out" },

      var headlineStart = phases[0].start + 0.08;
